<!--Arayüzde Bootstrap'in d-flex, align-items-center ve justify-content-center sınıflarını kullanarak giriş formunu her türlü 
ekran boyutunda tam merkeze sabitledim. Kart yapısı içindeki input-group ve FontAwesome ikonlarıyla modern bir kullanıcı 
deneyimi sağlarken, formun method="POST" ile yapılandırılması sayesinde kimlik bilgilerinin URL üzerinden açık bir şekilde 
gitmesini engelleyerek veri güvenliğinin ilk adımını attım.

Kodun JavaScript kısmında kullandığım URLSearchParams yapısı, PHP tarafındaki doğrulamadan dönen sonuçları yakalamaktadır. 
Eğer sunucu tarafında bir hata oluşursa, URL üzerinden gelen durum=hata veya durum=bos parametrelerini dinamik olarak analiz 
edip, Bootstrap alert sınıfları aracılığıyla kullanıcıya "Hatalı şifre" veya "Boş alan" uyarılarını anlık olarak gösteren 
interaktif bir yapı kurdum.

Formun gönderilme anını (submit) bir olay dinleyicisi ile takip ederek, verinin sunucuya çıkışını henüz tarayıcıdayken kontrol 
ediyorum. Bu aşamada sadece boş alan kontrolü yapmakla kalmayıp, projenin özel şartnamesi gereği e-posta adresinin
 @sakarya.edu.tr uzantılı olup olmadığını denetliyorum; eğer kriterler sağlanmazsa e.preventDefault() komutuyla formun 
 iletimini durdurup kullanıcıya yerinde müdahale ediyorum.-->

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Oktay Sürmeli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="hakkimda.html">OKTAY SÜRMELİ</a>
            <ul class="navbar-nav ms-auto small align-items-center">
                <li class="nav-item"><a class="nav-link" href="hakkimda.html">Geri Dön</a></li>
            </ul>
        </div>
    </nav>
    <!-- Kullanıcı Arayüzü: Giriş formunu dikey ve yatay eksende merkezleyerek kullanıcı odağını optimize eden responsive kapsayıcı. -->
    <main class="container mt-5 flex-grow-1 d-flex align-items-center justify-content-center mb-5">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-header bg-dark text-white text-center py-4 rounded-top-4">
                    <h3 class="mb-0"><i class="fa-solid fa-user-lock me-2 text-warning"></i>Öğrenci Girişi</h3>
                    <p class="mb-0 mt-2 small opacity-75">Sisteme erişmek için bilgilerinizi giriniz.</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    
                    <div id="hataKutusu" class="alert alert-danger d-none fw-bold text-center" role="alert"></div>
                    <!-- Veri İşleme Katmanı: Kimlik doğrulama verileri (email/şifre), güvenlik protokolleri gereği POST metodu ile iletilir. -->
                    <form id="loginForm" action="login_sonuc.php" method="POST">
                        <div class="mb-4">
                            <label for="email" class="form-label fw-bold">Öğrenci E-posta Adresi</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fa-solid fa-envelope"></i></span>
                                <input type="text" class="form-control" id="email" name="email" placeholder="Örn: b241210001@sakarya.edu.tr">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="sifre" class="form-label fw-bold">Şifre (Öğrenci No)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fa-solid fa-key"></i></span>
                                <input type="password" class="form-control" id="sifre" name="sifre" placeholder="Örn: b241210001">
                            </div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-warning btn-lg fw-bold text-dark rounded-pill shadow-sm">
                                <i class="fa-solid fa-right-to-bracket me-2"></i>Giriş Yap
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <small>&copy; 2026 Oktay Sürmeli | Sakarya Üniversitesi</small>
    </footer>

    <script>
        // 1. PHP'den Gelen Hata Yönlendirmelerini Yakalama (GET Parametresi)
        const urlParams = new URLSearchParams(window.location.search);
        const durum = urlParams.get('durum');
        const hataKutusu = document.getElementById('hataKutusu');

        if (durum === 'hata') {
            hataKutusu.innerHTML = "<i class='fa-solid fa-triangle-exclamation me-2'></i>Hatalı e-posta veya şifre girdiniz!";
            hataKutusu.classList.remove('d-none');
        } else if (durum === 'bos') {
            hataKutusu.innerHTML = "<i class='fa-solid fa-triangle-exclamation me-2'></i>Lütfen tüm alanları doldurun!";
            hataKutusu.classList.remove('d-none');
        }

        // 2. Native JS ile Boş Alan ve Mail Formatı Denetimi (Göndermeden Önce)
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const email = document.getElementById('email').value.trim();
            const sifre = document.getElementById('sifre').value.trim();
            let errorMessage = "";

            if (email === "" || sifre === "") {
                errorMessage = "E-posta ve şifre alanları boş bırakılamaz!";
            } else if (!email.includes('@sakarya.edu.tr')) {
                // Şartnamedeki "mail formatı kontrolü" kuralı
                errorMessage = "Lütfen geçerli bir @sakarya.edu.tr uzantılı mail giriniz!";
            }

            if (errorMessage !== "") {
                e.preventDefault(); // Formun PHP'ye gitmesini engeller
                hataKutusu.innerHTML = "<i class='fa-solid fa-circle-xmark me-2'></i>" + errorMessage;
                hataKutusu.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
