    <main class="container mt-5 flex-grow-1 mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-header bg-dark text-white text-center py-4 rounded-top-4">
                        <h2 class="mb-0"><i class="fa-solid fa-envelope-open-text me-2 text-warning"></i>İletişim Formu

                        <p class="mb-0 mt-2 small text-light opacity-75">Görüş, öneri ve projeleriniz için benimle
                            iletişime geçebilirsiniz.</p>
                    </div>
                    <div class="card-body p-4 p-md-5" id="iletisimUygulamasi">
                        <!-- JavaScript veya Vue.js ile form dogrulama hatalarini dinamik olarak gostermek icin kullanilan alan. -->
                        <div id="hataKutusu" class="alert alert-danger d-none fw-bold" role="alert"></div>
                        <!-- Veriler PHP tarafina POST metoduyla guvenli bir sekilde iletilir. -->
                        <form id="iletisimFormu" action="iletisim_sonuc.php" method="POST">

                            <div class="mb-3">
                                <label for="adSoyad" class="form-label fw-bold">Adınız Soyadınız <span
                                        class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="adSoyad" name="adSoyad"
                                    placeholder="Adınızı giriniz">
                            </div>
                            <!-- Bootstrap Grid yapisi: Inputlar masaustunde (md) yan yana, mobilde alt alta listelenir. -->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="email" class="form-label fw-bold">E-posta Adresiniz <span
                                            class="text-danger">*</span></label>
                                    <input type="email" class="form-control" id="email" name="email"
                                        placeholder="ornek@mail.com">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="telefon" class="form-label fw-bold">Telefon Numaranız <span
                                            class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="telefon" name="telefon"
                                        placeholder="Sadece rakam (Örn: 05551234567)">
                                </div>
                            </div>
                            <!-- PHP tarafında karmaşa çıkmasın diye veriyi burada standart hale getirdim; kullanıcı sadece bu listeden seçebilecek. -->
                            <div class="mb-3">
                                <label for="konu" class="form-label fw-bold">İletişim Konusu <span
                                        class="text-danger">*</span></label>
                                <select class="form-select" id="konu" name="konu">
                                    <option value="Seciniz" selected>Lütfen bir konu seçiniz...</option>
                                    <option value="Proje Teklifi">Yazılım / Proje Teklifi</option>
                                    <option value="Akademik">Akademik Konular</option>
                                    <option value="Diger">Diğer</option>
                                </select>
                            </div>
                            <!-- Tekil secim yapilmasi gereken veriler icin radio buton yapisi kullanıldı, 'name' özniteliği ile grup mantigi kurulmustur. -->
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold d-block">Cinsiyet <span
                                            class="text-danger">*</span></label>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="cinsiyet" id="erkek"
                                            value="Erkek">
                                        <label class="form-check-label" for="erkek">Erkek</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="cinsiyet" id="kadin"
                                            value="Kadın">
                                        <label class="form-check-label" for="kadin">Kadın</label>
                                    </div>
                                </div>
                              <!-- Grid Yapılandırması: Form elemanı, büyük ekranlarda sayfa genişliğinin yarısını (6/12) kaplayacak şekilde responsive olarak ayarlanmıştır. -->
                                <div class="col-md-6">
                                    <label class="form-label fw-bold d-block">Nasıl Ulaşalım?</label>
                                    <div class="form-check">
                                <!-- Veri Yönetimi: 'name' özniteliğindeki dizi (array) yapısı, birden fazla seçimin PHP tarafında kayıpsız işlenmesine olanak tanır. -->
                                        <input class="form-check-input" type="checkbox" name="iletisimTercihi[]" value="Mail" id="tercihMail">
                                        <label class="form-check-label" for="tercihMail">Mail ile dönüş yapılsın</label>
                                    </div>
                                <!-- Aynı 'name' değerine sahip checkbox elemanları, PHP tarafında 'iletisimTercihi' dizisinin (array) birer indisi olarak karşılanır.-->
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="iletisimTercihi[]"
                                            value="Telefon" id="tercihTel">
                                <!-- Etiketleme Mantığı: 'id' üzerinden kurulan bağlantı, hem ekran okuyucular için erişilebilirlik sağlar hem de tıklama alanını genişletir. -->
                                        <label class="form-check-label" for="tercihTel">Telefon ile aransın</label>
                                    </div>
                                </div>
                            </div>
                            <!-- Veri Tipi: Kullanıcının çok satırlı metin girişi yapabilmesi için 'input' yerine 'textarea' bileşeni tercih edilmiştir. -->
                            <div class="mb-4">
                                <label for="mesaj" class="form-label fw-bold">Mesajınız <span
                                        class="text-danger">*</span></label>
                            <!-- Ergonomi: 'rows="4"' parametresi ile alanın başlangıç yüksekliği kullanıcı deneyimi (UX) gözetilerek optimize edilmiştir. -->
                                <textarea class="form-control" id="mesaj" name="mesaj" rows="4"
                                    placeholder="Mesajınızı buraya yazabilirsiniz..."></textarea>
                            </div>
                            <!-- Burada da veri doğrulama süreçlerini Native JS ve Vue.js üzerinden simüle eden, responsive yapıdaki fonksiyonel buton grubu. -->
                            <hr class="mb-4">
                            <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                                <button type="button" class="btn btn-outline-dark btn-lg px-4 me-md-2" id="btnNative"
                                    onclick="dogrulaNativeJS()">
                                    <i class="fa-brands fa-js me-2"></i>Native JS ile Gönder
                                </button>

                                <button type="button" class="btn btn-success btn-lg px-4" id="btnVue"
                                    @click="dogrulaVueJS">
                                    <i class="fa-brands fa-vuejs me-2"></i>Vue.js ile Gönder
                                </button>

                                <button type="reset" class="btn btn-danger btn-lg px-4 ms-md-2"

    <script>

    // document.getElementById:Bu komut JavaScript'in HTML'deki kutulara erişimini sağlar . "Git ve bana 'adSoyad' ID'li kutunun içindeki yazıyı getir" der-->        
    /*Kullanıcı formu her gönderdiğinde önceki denemeden kalan hataların ekranda birikmemesi gerekir. Bu fonksiyon ile önce hata kutusunu DOM üzerinden yakalayıp, 
Bootstrap'in d-none sınıfıyla gizliyorum ve içindeki innerHTML verisini boşaltarak arayüzü başlangıç durumuna getiriyorum*/
        function temizleHatalari() {
            const hataKutusu = document.getElementById('hataKutusu');
            hataKutusu.classList.add('d-none');
            hataKutusu.innerHTML = '';
        }

  /*Bu kısım biraz fazla açıklama istese de yazacağım hihihi(ilerde unutamaaaam), Client-side Validation (istemci taraflı doğrulama) ile sunucu yükünü azaltıp kullanıcı deneyimini (UX) 
  ve veri bütünlüğünü en üst seviyede tutmaktır. Bu amaçla, hem Native JS hem de Vue.js 3 framework'ünü kullanarak, 
  DOM üzerindeki verilere getElementById ile erişip mantıksal kontrolleri if bloklarıyla, teknik format kontrollerini ise 
  Regex süzgeçleriyle gerçekleştirdim. Tespit edilen tüm hataları dinamik bir Dizi (Array) içerisinde toplayıp, Bootstrap'in 
  alert ve d-none sınıflarıyla kullanıcıya anlık görsel geri bildirim vererek, formun ancak tüm kriterler sağlandığında submit() edilmesini 
  sağlayan profesyonel bir kontrol mekanizması inşa ettim.*/
  //trim(): Kullanıcının yanlışlıkla bıraktığı boşlukları siler.
        function dogrulaNativeJS() {
            temizleHatalari();
            let hatalar = [];
            const formID = document.getElementById('iletisimFormu');
            const hataKutusu = document.getElementById('hataKutusu');

            let ad = document.getElementById('adSoyad').value.trim();
            let email = document.getElementById('email').value.trim();
            let tel = document.getElementById('telefon').value.trim();
            let konu = document.getElementById('konu').value;
            let mesaj = document.getElementById('mesaj').value.trim();
            let cinsiyet = document.querySelector('input[name="cinsiyet"]:checked');

            if (ad === "" || email === "" || tel === "" || mesaj === "") hatalar.push("- Lütfen zorunlu tüm metin alanlarını doldurunuz.");
            if (konu === "Seciniz") hatalar.push("- Lütfen bir iletişim konusu seçiniz.");
            if (!cinsiyet) hatalar.push("- Lütfen cinsiyet belirtiniz.");
            //  E-posta ve telefon formatlarının doğruluğunu kontrol eder.
            let emailFormat = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (email !== "" && !emailFormat.test(email)) hatalar.push("- Geçerli bir e-posta giriniz.");

            let telFormat = /^[0-9]{10,11}$/;
            if (tel !== "" && !telFormat.test(tel)) hatalar.push("- Telefon sadece rakam (10-11 hane) olmalıdır.");
            //Dizi (errors array) doluluğuna göre form gönderimini engeller veya onaylar.
            if (hatalar.length > 0) {
                hataKutusu.innerHTML = "<strong>Native JS Hatası:</strong><br>" + hatalar.join("<br>");
                hataKutusu.className = 'alert alert-danger fw-bold';
            } else {
                formID.submit();// Sunucu tarafına (PHP) veri gönderimini tetikler.
            }
        }
    </script>


<!--Tüm doğrulama mantığı createApp ile bir paket haline getirilir, bu da kodun daha düzenli ve modüler olmasını sağlar.
En büyük farkı .mount('#iletisimUygulamasi') kısmıdır; bu sayede JavaScript kodunun sadece belirli bir HTML alanına hükmetmesini sağlayarak çakışmaları önlerimm.
try-catch bloğu kullanarak, Vue kütüphanesinde bir sorun çıksa bile sistemin çökmemesini ve hata mesajı vermesini sağladım.-->
    <script>
        try {
            const { createApp } = Vue;// Vue 3 kütüphanesinden uygulama oluşturma fonksiyonu deconstruct edildi.
            createApp({
                methods: {
                    // Framework tabanlı doğrulama: Vue metodları içerisinde form kontrol mantığı yürütülür.
                    dogrulaVueJS() {
                        temizleHatalari();
                        let hatalarVue = [];
                        // DOM Erişimi: Vue instance içerisinden ilgili form bileşenlerine erişim sağlanır.
                        const formID = document.getElementById('iletisimFormu');
                        const hataKutusu = document.getElementById('hataKutusu');

                        let ad = document.getElementById('adSoyad').value.trim();
                        let email = document.getElementById('email').value.trim();
                        let tel = document.getElementById('telefon').value.trim();
                        let konu = document.getElementById('konu').value;
                        let mesaj = document.getElementById('mesaj').value.trim();
                        let cinsiyet = document.querySelector('input[name="cinsiyet"]:checked');

                        if (!ad || !email || !tel || !mesaj) hatalarVue.push("- (Vue) Zorunlu alanları eksiksiz doldurunuz.");
                        if (konu === "Seciniz") hatalarVue.push("- (Vue) İletişim konusu seçilmedi.");
                        if (!cinsiyet) hatalarVue.push("- (Vue) Cinsiyet alanı zorunludur.");
                        if (email && !email.includes('@')) hatalarVue.push("- (Vue) E-posta '@' içermelidir.");
                        if (tel && (isNaN(tel) || tel.length < 10)) hatalarVue.push("- (Vue) Telefon sadece sayı ve min 10 hane olmalı.");
                        //Doğrulama mantığı
                        if (hatalarVue.length > 0) {
                            hataKutusu.innerHTML = "<strong>Vue.js Hatası:</strong><br>" + hatalarVue.join("<br>");
                            hataKutusu.className = 'alert alert-warning text-dark fw-bold';
                        } else {
                            formID.submit();// Başarılı doğrulama sonrası form sunucuya iletilir.
                        }
                    }
                }
            }).mount('#iletisimUygulamasi');// Vue uygulaması, ID'si 'iletisimUygulamasi' olan kapsayıcıya bağlanır.
        } catch (error) {
            console.log("Vue.js bağlantısı kurulamadı.");
        }
    </script>
<!--Sitemin tasarımı yine güzel görünürdü ama menülerim açılmazdı ve butonlarım hiçbir tepki vermezdi; yani sistem hareketsiz kalırdı.Bu yüzden eklemek istedim - _ - -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
